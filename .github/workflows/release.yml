name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Ubuntu's packaged stdeb is broken on Python 3.12, so use PyPI's
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-all python3-setuptools dh-python debhelper fakeroot
          python3 -m pip install --user --break-system-packages stdeb

      - name: Build .deb
        run: python3 setup.py --command-packages=stdeb.command bdist_deb

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" deb_dist/*.deb --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" deb_dist/*.deb --clobber
